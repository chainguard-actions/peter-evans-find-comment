name: Test basic usage - find comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: find
        uses: .
        continue-on-error: true
        with:
          issue-number: 1

      - name: Assert action ran (outputs set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.find.outcome }}
          COMMENT_ID: ${{ steps.find.outputs.comment-id }}
          COMMENT_BODY: ${{ steps.find.outputs.comment-body }}
          COMMENT_AUTHOR: ${{ steps.find.outputs.comment-author }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: $COMMENT_ID"
          echo "comment-body: $COMMENT_BODY"
          echo "comment-author: $COMMENT_AUTHOR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no comment found is a valid result)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
