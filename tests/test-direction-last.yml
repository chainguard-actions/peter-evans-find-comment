name: Test direction last
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: find
        uses: .
        continue-on-error: true
        with:
          issue-number: 1
          direction: last

      - name: Assert action ran with direction=last
        env:
          OUTCOME: ${{ steps.find.outcome }}
          COMMENT_ID: ${{ steps.find.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with direction=last"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
