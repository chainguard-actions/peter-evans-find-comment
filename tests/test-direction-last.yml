name: Test direction=last with nth parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: find-comment
        uses: .
        with:
          repository: peter-evans/find-comment
          issue-number: 1
          body-includes: 'NONEXISTENT_COMMENT_DIRECTION_TEST_XYZ_54321'
          direction: last
          nth: 0

      - name: Assert no comment found with direction=last - comment-id is empty
        env:
          COMMENT_ID: ${{ steps.find-comment.outputs.comment-id }}
        run: |
          echo "comment-id: '$COMMENT_ID'"
          if [ -n "$COMMENT_ID" ]; then
            echo "FAIL: expected no comment-id but got: $COMMENT_ID"
            exit 1
          fi
          echo "PASS: no comment found with direction=last as expected"

      - id: find-comment-first
        uses: .
        with:
          repository: peter-evans/find-comment
          issue-number: 1
          body-includes: 'NONEXISTENT_COMMENT_DIRECTION_TEST_XYZ_54321'
          direction: first
          nth: 0

      - name: Assert no comment found with direction=first - comment-id is empty
        env:
          COMMENT_ID: ${{ steps.find-comment-first.outputs.comment-id }}
        run: |
          echo "comment-id: '$COMMENT_ID'"
          if [ -n "$COMMENT_ID" ]; then
            echo "FAIL: expected no comment-id but got: $COMMENT_ID"
            exit 1
          fi
          echo "PASS: no comment found with direction=first as expected"
