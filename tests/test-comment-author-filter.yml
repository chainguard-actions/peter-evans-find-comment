name: Test comment-author filter - no match found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: find-comment
        uses: .
        with:
          repository: peter-evans/find-comment
          issue-number: 1
          comment-author: 'nonexistent-user-xyz-99999-abcdef'

      - name: Assert no comment found for nonexistent author - comment-id is empty
        env:
          COMMENT_ID: ${{ steps.find-comment.outputs.comment-id }}
        run: |
          echo "comment-id: '$COMMENT_ID'"
          if [ -n "$COMMENT_ID" ]; then
            echo "FAIL: expected no comment-id but got: $COMMENT_ID"
            exit 1
          fi
          echo "PASS: no comment found for nonexistent author as expected"

      - name: Assert no comment found for nonexistent author - comment-author output is empty
        env:
          COMMENT_AUTHOR: ${{ steps.find-comment.outputs.comment-author }}
        run: |
          echo "comment-author: '$COMMENT_AUTHOR'"
          if [ -n "$COMMENT_AUTHOR" ]; then
            echo "FAIL: expected no comment-author but got: $COMMENT_AUTHOR"
            exit 1
          fi
          echo "PASS: comment-author output is empty as expected"
