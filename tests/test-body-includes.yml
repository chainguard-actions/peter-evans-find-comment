name: Test find-comment with body-includes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: find
        uses: .
        with:
          token: ${{ github.token }}
          repository: peter-evans/find-comment
          issue-number: 1
          body-includes: "test"
        continue-on-error: true
      - name: Assert outputs exist (even if empty)
        env:
          COMMENT_ID: ${{ steps.find.outputs.comment-id }}
          COMMENT_BODY: ${{ steps.find.outputs.comment-body }}
          COMMENT_AUTHOR: ${{ steps.find.outputs.comment-author }}
          OUTCOME: ${{ steps.find.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: $COMMENT_ID"
          echo "comment-body: $COMMENT_BODY"
          echo "comment-author: $COMMENT_AUTHOR"
          # The action should either succeed (with or without a match) or fail due to API limits
          # We just verify the step ran and outputs are accessible
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
